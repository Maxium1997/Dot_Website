{% extends "base.html" %}
{% load static %}

{% block body %}
<div class="container py-4" style="max-width: 900px; padding-bottom: 80px;">
    <div id="user-section" class="card shadow-sm mb-3 {% if not user.is_authenticated %}d-none{% endif %} border-0">
        <div class="card-body d-flex align-items-center justify-content-between">
            <div class="d-flex align-items-center">
                <img id="user-img" src="{{ user_profile_img|default:'https://cdn-icons-png.flaticon.com/512/149/149071.png' }}"
                     class="rounded-circle me-3" style="width: 50px; height: 50px; object-fit: cover; border: 2px solid #f0f0f0;">
                <div>
                    <div class="fw-bold fs-5"><span id="user-name">{{ user.first_name|default:user.username }}</span></div>
                    <div class="text-muted small">歡迎回來</div>
                </div>
            </div>
            <div class="text-end">
                <div class="text-primary small fw-bold mb-1">
                    <i class="bi bi-lightning-fill"></i> 我的餘額
                </div>
                <div class="d-flex align-items-center justify-content-end">
                    <span id="gym-balance" class="fw-black fs-4 me-2">0</span>
                    <span class="text-muted small me-3">pts</span>

                    <a href="{% url 'badminton_court_management:topup_page' %}"
                       class="btn btn-sm btn-primary rounded-pill d-flex align-items-center px-3 shadow-sm">
                        儲值 <i class="bi bi-plus-lg ms-1"></i>
                    </a>
                </div>
            </div>
        </div>
    </div>

    <div class="card shadow-sm mb-4 border-0">
        <div class="card-body row g-3">
            <div class="col-6">
                <label class="form-label small fw-bold text-muted">選擇球館</label>
                <select id="gym-select" class="form-select border-0 bg-light shadow-none"></select>
            </div>
            <div class="col-6">
                <label class="form-label small fw-bold text-muted">預約日期</label>
                <input type="date" id="booking-date" class="form-select border-0 bg-light shadow-none">
            </div>
        </div>
    </div>

    <div id="slots-loader" class="text-center d-none my-5">
        <div class="spinner-border text-primary"></div>
    </div>

    <div id="slots-container"></div>
</div>

<div id="selection-bar" class="fixed-bottom bg-white shadow-lg border-top d-none animate__animated animate__slideInUp">
    <div class="container py-3 d-flex justify-content-between align-items-center">
        <div>
            <span class="fw-bold text-primary fs-5" id="selected-count">0</span>
            <span class="small text-muted">個選中時段</span>
        </div>
        <button id="confirm-booking-btn" class="btn btn-primary px-4 rounded-pill fw-bold" onclick="submitMultiBooking()">
            確認預約
        </button>
    </div>
</div>

{% csrf_token %}

<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
    const LIFF_ID = "{{ liff_id }}";
    const API_BASE = "/badminton_court_management/api"; // 使用相對路徑更安全

    let selectedSlots = new Map();

    // 取得 CSRF Token 的標準方法
    function getCsrfToken() {
        return document.querySelector('[name=csrfmiddlewaretoken]').value;
    }

    async function initLiff() {
        initDatePicker();
        try {
            await liff.init({ liffId: LIFF_ID });
            if (liff.isLoggedIn()) {
                const token = liff.getAccessToken();
                const loginSuccess = await syncUserSession(token);

                if (loginSuccess) {
                    const profile = await liff.getProfile();
                    document.getElementById('user-name').innerText = profile.displayName;
                    if (profile.pictureUrl) document.getElementById('user-img').src = profile.pictureUrl;
                    document.getElementById('user-section').classList.remove('d-none');
                }
            }
            await loadGyms();
        } catch (err) {
            console.error("LIFF Init Error:", err);
            await loadGyms();
        }
    }

    async function syncUserSession(token) {
        try {
            const res = await fetch(`${API_BASE}/liff-login/`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCsrfToken()
                },
                body: JSON.stringify({ access_token: token })
            });
            return res.ok;
        } catch (e) {
            return false;
        }
    }

    // ... (loadGyms, loadBalance, loadSlots 保持邏輯不變，但 Headers 改用 getCsrfToken())

    async function submitMultiBooking() {
        const count = selectedSlots.size;
        if (!confirm(`確定要預約這 ${count} 個時段嗎？`)) return;

        const btn = document.getElementById('confirm-booking-btn');
        btn.disabled = true; // 防止重複點擊
        btn.innerText = "處理中...";

        const gymId = document.getElementById('gym-select').value;
        const date = document.getElementById('booking-date').value;
        const slotsArray = Array.from(selectedSlots.values());

        try {
            const results = await Promise.all(slotsArray.map(slot =>
                fetch(`${API_BASE}/create-booking/`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': getCsrfToken()
                    },
                    body: JSON.stringify({ gym_id: gymId, court_name: slot.court, date: date, start_time: slot.time })
                }).then(r => r.json())
            ));

            const successCount = results.filter(r => r.status === 'success').length;
            const failMessages = results.filter(r => r.status !== 'success').map(r => r.msg).join('\n');

            if (successCount === results.length) {
                alert(`✨ 預約完成！共 ${successCount} 個時段。`);
            } else {
                alert(`預約部分完成。\n成功：${successCount}\n失敗：${results.length - successCount}\n原因：${failMessages}`);
            }

            selectedSlots.clear();
            updateUI();
            updateGymInfo();
        } catch (err) {
            alert('系統繁忙，請稍後再試');
        } finally {
            btn.disabled = false;
            btn.innerText = "確認預約";
        }
    }

    initLiff();
</script>
{% endblock %}
