{% extends "base.html" %}
{% load static %}

{% block breadcrumb %}
<li class="breadcrumb-item active" aria-current="page">Badminton Booking</li>
{% endblock %}

{% block body %}
<div class="container py-4" style="max-width: 600px;">
    <div id="user-section" class="card shadow-sm mb-3 d-none border-0">
        <div class="card-body d-flex align-items-center">
            <img id="user-img" src="" class="rounded-circle me-3" style="width: 50px; height: 50px; object-fit: cover;">
            <div>
                <div class="fw-bold"><span id="user-name">載入中...</span></div>
                <div class="text-primary small">
                    <i class="bi bi-wallet2"></i> 本館餘額：<span id="gym-balance" class="fw-bold">0</span> pts
                </div>
            </div>
        </div>
    </div>

    <div class="card shadow-sm mb-4 border-0">
        <div class="card-body">
            <div class="row g-2">
                <div class="col-6">
                    <label class="form-label small fw-bold text-muted">選擇球館</label>
                    <select id="gym-select" class="form-select border-0 bg-light"></select>
                </div>
                <div class="col-6">
                    <label class="form-label small fw-bold text-muted">預約日期</label>
                    <input type="date" id="booking-date" class="form-select border-0 bg-light">
                </div>
            </div>
        </div>
    </div>

    <div id="slots-loader" class="text-center d-none my-5">
        <div class="spinner-border text-primary" role="status"></div>
    </div>
    <div id="slots-container" class="row"></div>
</div>

<input type="hidden" id="csrf-token" value="{{ csrf_token }}">

<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
    // 1. 全域配置：確保 API 與 LIFF ID 正確
    const LIFF_ID = "{{ liff_id }}";
    const API_BASE = window.location.origin + "/badminton_court_management/api";

    // 2. 初始化日期：鎖定台北時間，避免凌晨時段日期錯誤
    function initDatePicker() {
        const taipeiDate = new Intl.DateTimeFormat('en-CA', {
            timeZone: 'Asia/Taipei',
            year: 'numeric', month: '2-digit', day: '2-digit'
        }).format(new Date());

        const dateInput = document.getElementById('booking-date');
        dateInput.setAttribute('min', taipeiDate);

        // 只有在日期欄位為空時才設定預設值
        if (!dateInput.value) {
            dateInput.value = taipeiDate;
        }
    }

    // 3. 初始化 LIFF
    async function initLiff() {
        initDatePicker();
        console.log("LIFF 開始初始化...");
        try {
            if (!LIFF_ID || LIFF_ID === "None" || LIFF_ID === "") {
                console.warn("未偵測到 LIFF_ID，進入純網頁測試模式");
                await loadGyms();
                return;
            }

            await liff.init({ liffId: LIFF_ID });
            if (!liff.isLoggedIn()) {
                liff.login();
            } else {
                const profile = await liff.getProfile();
                document.getElementById('user-name').innerText = profile.displayName;
                document.getElementById('user-img').src = profile.pictureUrl;
                document.getElementById('user-section').classList.remove('d-none');
                await loadGyms();
            }
        } catch (err) {
            console.error('LIFF 初始化失敗:', err);
            await loadGyms(); // 失敗時仍嘗試載入球館供測試
        }
    }

    // 4. 獲取球館清單
    async function loadGyms() {
        try {
            const res = await fetch(`${API_BASE}/get-gyms/`, {
                headers: { 'ngrok-skip-browser-warning': 'true' }
            });
            if (!res.ok) throw new Error(`HTTP 錯誤: ${res.status}`);

            const gyms = await res.json();
            const select = document.getElementById('gym-select');
            select.innerHTML = '';

            if (gyms.length === 0) {
                select.add(new Option("目前無可用球館", ""));
                return;
            }

            gyms.forEach(gym => {
                select.add(new Option(gym.name, gym.id));
            });

            // 綁定事件監聽
            select.addEventListener('change', updateGymInfo);
            document.getElementById('booking-date').addEventListener('change', loadSlots);

            // 執行初次加載
            updateGymInfo();
        } catch (e) {
            console.error("載入球館失敗:", e);
            alert("無法獲取球館清單，請檢查伺服器狀態。");
        }
    }

    // 5. 更新資訊
    async function updateGymInfo() {
        await loadBalance();
        await loadSlots();
    }

    // 6. 載入點數餘額
    async function loadBalance() {
        const gymId = document.getElementById('gym-select').value;
        if (!gymId) return;
        try {
            const res = await fetch(`${API_BASE}/get-user-balance/?gym_id=${gymId}`, {
                headers: { 'ngrok-skip-browser-warning': 'true' }
            });
            const data = await res.json();
            document.getElementById('gym-balance').innerText = data.points || 0;
        } catch (e) { console.error("點數載入失敗", e); }
    }

    // 7. 載入時段（最關鍵的部分）
    async function loadSlots() {
        const gymId = document.getElementById('gym-select').value;
        const date = document.getElementById('booking-date').value;
        const container = document.getElementById('slots-container');

        if (!date || !gymId) return;

        document.getElementById('slots-loader').classList.remove('d-none');
        container.innerHTML = '';

        try {
            const res = await fetch(`${API_BASE}/get-slots/?date=${date}&gym_id=${gymId}`, {
                headers: { 'ngrok-skip-browser-warning': 'true' }
            });

            if (!res.ok) {
                const errorData = await res.json();
                throw new Error(errorData.error || `伺服器錯誤 ${res.status}`);
            }

            const data = await res.json();
            if (Object.keys(data).length === 0) {
                container.innerHTML = '<div class="col-12 text-center text-muted py-5">此日期無可用時段。</div>';
                return;
            }

            for (const [courtName, slots] of Object.entries(data)) {
                let html = `
                    <div class="col-12 mb-4">
                        <h6 class="fw-bold mb-3"><i class="bi bi-grid-3x3-gap"></i> ${courtName} </h6>
                        <div class="row row-cols-3 g-2">
                `;
                slots.forEach(slot => {
                    const btnClass = slot.is_available ? 'btn-outline-success' : 'btn-light text-muted border-0';
                    const disabled = slot.is_available ? '' : 'disabled';
                    const onClick = slot.is_available ? `onclick="confirmBooking('${courtName}', '${slot.time}')"` : '';
                    html += `
                        <div class="col">
                            <button class="btn btn-sm w-100 py-2 ${btnClass}" ${disabled} ${onClick}>
                                ${slot.time}
                            </button>
                        </div>
                    `;
                });
                html += `</div></div>`;
                container.innerHTML += html;
            }
        } catch (err) {
            console.error("時段載入失敗:", err);
            container.innerHTML = `<div class="alert alert-danger">載入失敗: ${err.message}</div>`;
        } finally {
            document.getElementById('slots-loader').classList.add('d-none');
        }
    }

    // 8. 預約確認
    function confirmBooking(courtName, time) {
        const date = document.getElementById('booking-date').value;
        const gymName = document.getElementById('gym-select').options[document.getElementById('gym-select').selectedIndex].text;
        if (confirm(`確定預約：\n📍 ${gymName}\n🏸 ${courtName} 號場\n📅 ${date}\n⏰ ${time}`)) {
            executeBooking(courtName, date, time);
        }
    }

    // 9. 執行預約
    async function executeBooking(courtName, date, time) {
        const gymId = document.getElementById('gym-select').value;
        const csrfToken = document.getElementById('csrf-token').value;

        try {
            const response = await fetch(`${API_BASE}/create-booking/`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': csrfToken,
                    'ngrok-skip-browser-warning': 'true'
                },
                body: JSON.stringify({ gym_id: gymId, court_name: courtName, date: date, start_time: time })
            });

            const result = await response.json();
            if (result.status === 'success') {
                alert('✨ 預約成功！');
                updateGymInfo();
            } else {
                alert('❌ 失敗：' + result.msg);
            }
        } catch (err) {
            alert('預約系統異常，請稍後再試。');
        }
    }

    // 啟動
    initLiff();
</script>

<style>
    body { background-color: #f8f9fa; }
    .btn-outline-success { color: #198754; border-color: #198754; }
    .btn-outline-success:hover { background-color: #198754; color: #fff; }
</style>
{% endblock %}
