{% extends "base.html" %}
{% load static %}

{% block body %}
<div class="container py-4" style="max-width: 900px; padding-bottom: 80px;">
    <div id="booking-alert" class="alert d-none" role="alert"></div>
    <div id="user-section" class="card shadow-sm mb-3 {% if not user.is_authenticated %}d-none{% endif %} border-0">
        <div class="card-body d-flex align-items-center justify-content-between">
            <div class="d-flex align-items-center">
                <img id="user-img" src="{{ user_profile_img|default:'https://cdn-icons-png.flaticon.com/512/149/149071.png' }}"
                     class="rounded-circle me-3" style="width: 50px; height: 50px; object-fit: cover; border: 2px solid #f0f0f0;">
                <div>
                    <div class="fw-bold fs-5"><span id="user-name">{{ user.first_name|default:user.username }}</span></div>
                    <div class="text-muted small">歡迎回來</div>
                </div>
            </div>
            <div class="text-end">
                <div class="text-primary small fw-bold mb-1">
                    <i class="bi bi-lightning-fill"></i> 我的餘額
                </div>
                <div class="d-flex align-items-center justify-content-end">
                    <span id="gym-balance" class="fw-black fs-4 me-2">0</span>
                    <span class="text-muted small me-3">pts</span>

                    <a href="{% url 'badminton_court_management:topup_page' %}"
                       class="btn btn-sm btn-primary rounded-pill d-flex align-items-center px-3 shadow-sm">
                        儲值 <i class="bi bi-plus-lg ms-1"></i>
                    </a>
                </div>
            </div>
        </div>
    </div>

    <div class="card shadow-sm mb-4 border-0">
        <div class="card-body row g-3">
            <div class="col-6">
                <label class="form-label small fw-bold text-muted">選擇球館</label>
                <select id="gym-select" class="form-select border-0 bg-light shadow-none">
                    {% if gyms %}
                        {% for gym in gyms %}
                            <option value="{{ gym.id }}">{{ gym.name }}</option>
                        {% endfor %}
                    {% else %}
                        <option value="">目前沒有球館</option>
                    {% endif %}
                </select>
            </div>
            <div class="col-6">
                <label class="form-label small fw-bold text-muted">預約日期</label>
                <input type="date" id="booking-date" class="form-select border-0 bg-light shadow-none">
            </div>
        </div>
    </div>

    <div id="slots-loader" class="text-center d-none my-5">
        <div class="spinner-border text-primary"></div>
    </div>

    <div id="slots-container"></div>
</div>

<div id="selection-bar" class="fixed-bottom bg-white shadow-lg border-top d-none animate__animated animate__slideInUp">
    <div class="container py-3 d-flex justify-content-between align-items-center">
        <div>
            <span class="fw-bold text-primary fs-5" id="selected-count">0</span>
            <span class="small text-muted">個選中時段</span>
        </div>
        <button id="confirm-booking-btn" class="btn btn-primary px-4 rounded-pill fw-bold" onclick="submitMultiBooking()">
            確認預約
        </button>
    </div>
</div>

{% csrf_token %}

<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
    const LIFF_ID = "{{ liff_id }}";
    const API_BASE = "/badminton_court_management/api"; // 使用相對路徑更安全

    let selectedSlots = new Map();

    // 取得 CSRF Token 的標準方法
    function getCsrfToken() {
        return document.querySelector('[name=csrfmiddlewaretoken]').value;
    }

    async function initLiff() {
        initDatePicker();
        try {
            await liff.init({ liffId: LIFF_ID });
            if (liff.isLoggedIn()) {
                const token = liff.getAccessToken();
                const loginSuccess = await syncUserSession(token);

                if (loginSuccess) {
                    const profile = await liff.getProfile();
                    document.getElementById('user-name').innerText = profile.displayName;
                    if (profile.pictureUrl) document.getElementById('user-img').src = profile.pictureUrl;
                    document.getElementById('user-section').classList.remove('d-none');
                }
            }
            await loadGyms();
        } catch (err) {
            console.error("LIFF Init Error:", err);
            await loadGyms();
        }
    }

    async function syncUserSession(token) {
        try {
            const res = await fetch(`${API_BASE}/liff-login/`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCsrfToken()
                },
                body: JSON.stringify({ access_token: token })
            });
            return res.ok;
        } catch (e) {
            return false;
        }
    }

    function initDatePicker() {
        const dateInput = document.getElementById('booking-date');
        const today = new Date();
        const yyyy = today.getFullYear();
        const mm = String(today.getMonth() + 1).padStart(2, '0');
        const dd = String(today.getDate()).padStart(2, '0');
        const todayStr = `${yyyy}-${mm}-${dd}`;
        dateInput.min = todayStr;
        dateInput.value = todayStr;
    }

    async function loadGyms() {
        const select = document.getElementById('gym-select');
        try {
            const res = await fetch(`${API_BASE}/get-gyms/`);
            const gyms = await res.json();

            if (!Array.isArray(gyms) || gyms.length === 0) {
                // 保留伺服器端已渲染的球館選單
                if (select.options.length === 0) {
                    const opt = document.createElement('option');
                    opt.value = '';
                    opt.textContent = '目前沒有球館';
                    select.appendChild(opt);
                }
                return;
            }

            select.innerHTML = '';
            const frag = document.createDocumentFragment();
            gyms.forEach(gym => {
                const opt = document.createElement('option');
                opt.value = gym.id;
                opt.textContent = gym.name;
                frag.appendChild(opt);
            });
            select.appendChild(frag);
        } catch (err) {
            console.error('Load gyms error:', err);
        } finally {
            select.addEventListener('change', updateGymInfo);
            document.getElementById('booking-date').addEventListener('change', loadSlots);
            if (select.value) {
                await updateGymInfo();
            }
        }
    }

    async function loadBalance() {
        const gymId = document.getElementById('gym-select').value;
        if (!gymId) return;
        try {
            const res = await fetch(`${API_BASE}/get-user-balance/?gym_id=${gymId}`);
            const data = await res.json();
            document.getElementById('gym-balance').innerText = data.points ?? 0;
        } catch (err) {
            console.error('Load balance error:', err);
        }
    }

    async function loadSlots() {
        const gymId = document.getElementById('gym-select').value;
        const date = document.getElementById('booking-date').value;
        if (!gymId || !date) return;

        const loader = document.getElementById('slots-loader');
        const container = document.getElementById('slots-container');
        loader.classList.remove('d-none');
        container.innerHTML = '';

        try {
            const res = await fetch(`${API_BASE}/get-slots/?date=${date}&gym_id=${gymId}`);
            const data = await res.json();

            const courts = Object.keys(data || {});
            if (!courts.length) {
                container.innerHTML = '<div class="text-muted text-center py-4">目前沒有可預約場地</div>';
                return;
            }
            // Build a matrix table: rows = hours, columns = courts
            const table = document.createElement('table');
            table.className = 'table table-bordered align-middle text-center bg-white shadow-sm';

            const thead = document.createElement('thead');
            const headRow = document.createElement('tr');
            headRow.innerHTML = '<th style="width:80px;">起</th><th style="width:80px;">迄</th>';
            courts.forEach(court => {
                const th = document.createElement('th');
                th.textContent = `${court}場地`;
                headRow.appendChild(th);
            });
            thead.appendChild(headRow);
            table.appendChild(thead);

            const tbody = document.createElement('tbody');

            // Build lookup map: court -> time -> is_available
            const slotMap = {};
            courts.forEach(court => {
                slotMap[court] = {};
                (data[court] || []).forEach(slot => {
                    slotMap[court][slot.time] = {
                        is_available: slot.is_available,
                        booked_by: slot.booked_by,
                    };
                });
            });

            for (let hour = 9; hour < 24; hour++) {
                const start = `${String(hour).padStart(2, '0')}00`;
                const end = `${String(hour + 1).padStart(2, '0')}00`;
                const row = document.createElement('tr');

                const tdStart = document.createElement('td');
                tdStart.textContent = start;
                tdStart.className = 'bg-light fw-bold';
                const tdEnd = document.createElement('td');
                tdEnd.textContent = end;
                tdEnd.className = 'bg-light fw-bold';
                row.appendChild(tdStart);
                row.appendChild(tdEnd);

                courts.forEach(court => {
                    const td = document.createElement('td');
                    const timeKey = `${String(hour).padStart(2, '0')}:00`;
                    const slotInfo = slotMap[court][timeKey] || {};
                    const isAvailable = slotInfo.is_available === true;
                    const bookedBy = slotInfo.booked_by || '';

                    if (isAvailable) {
                        const btn = document.createElement('button');
                        btn.type = 'button';
                        btn.className = 'btn btn-sm btn-outline-primary w-100';
                        btn.textContent = '可預約';
                        btn.dataset.court = court;
                        btn.dataset.time = timeKey;
                        btn.addEventListener('click', () => toggleSlot(btn));
                        td.appendChild(btn);
                    } else {
                        const btn = document.createElement('button');
                        btn.type = 'button';
                        btn.className = 'btn btn-sm btn-outline-secondary w-100';
                        btn.textContent = bookedBy ? `${bookedBy} 已預約` : '已預約';
                        btn.disabled = true;
                        td.appendChild(btn);
                    }
                    row.appendChild(td);
                });

                tbody.appendChild(row);
            }

            table.appendChild(tbody);
            container.appendChild(table);
        } catch (err) {
            console.error('Load slots error:', err);
            container.innerHTML = '<div class="text-danger text-center py-4">載入失敗，請稍後再試</div>';
        } finally {
            loader.classList.add('d-none');
        }
    }

    function toggleSlot(button) {
        const court = button.dataset.court;
        const time = button.dataset.time;
        const key = `${court}_${time}`;

        if (selectedSlots.has(key)) {
            selectedSlots.delete(key);
            setSlotButtonState(button, false);
        } else {
            selectedSlots.set(key, { court, time });
            setSlotButtonState(button, true);
        }
        updateUI();
    }

    function setSlotButtonState(button, selected) {
        if (selected) {
            button.classList.remove('btn-outline-primary');
            button.classList.add('btn-success');
            button.innerHTML = '<i class="bi bi-check-lg me-1"></i>已勾選';
        } else {
            button.classList.remove('btn-success');
            button.classList.add('btn-outline-primary');
            button.textContent = '可預約';
        }
    }

    function updateUI() {
        const count = selectedSlots.size;
        document.getElementById('selected-count').innerText = count;
        const bar = document.getElementById('selection-bar');
        if (count > 0) {
            bar.classList.remove('d-none');
        } else {
            bar.classList.add('d-none');
        }
    }

    async function updateGymInfo() {
        selectedSlots.clear();
        updateUI();
        await loadBalance();
        await loadSlots();
    }

    async function submitMultiBooking() {
        const count = selectedSlots.size;
        if (!confirm(`確定要預約這 ${count} 個時段嗎？`)) return;

        const btn = document.getElementById('confirm-booking-btn');
        btn.disabled = true; // 防止重複點擊
        btn.innerText = "處理中...";

        const gymId = document.getElementById('gym-select').value;
        const date = document.getElementById('booking-date').value;
        const slotsArray = Array.from(selectedSlots.values());

        try {
            const results = await Promise.all(slotsArray.map(slot =>
                fetch(`${API_BASE}/create-booking/`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': getCsrfToken()
                    },
                    body: JSON.stringify({ gym_id: gymId, court_name: slot.court, date: date, start_time: slot.time })
                }).then(r => r.json())
            ));

            const successCount = results.filter(r => r.status === 'success').length;
            const failMessages = results.filter(r => r.status !== 'success').map(r => r.msg).join('\n');

            if (successCount === results.length) {
                showBookingAlert('success', `✨ 預約完成！共 ${successCount} 個時段。`);
            } else {
                showBookingAlert(
                    'warning',
                    `預約部分完成。成功：${successCount}，失敗：${results.length - successCount}。${failMessages ? `原因：${failMessages}` : ''}`
                );
            }

            selectedSlots.clear();
            updateUI();
            updateGymInfo();
        } catch (err) {
            showBookingAlert('danger', '系統繁忙，請稍後再試');
        } finally {
            btn.disabled = false;
            btn.innerText = "確認預約";
        }
    }

    function showBookingAlert(type, message) {
        const alertBox = document.getElementById('booking-alert');
        alertBox.className = `alert alert-${type}`;
        alertBox.textContent = message;
        alertBox.classList.remove('d-none');
        setTimeout(() => {
            alertBox.classList.add('d-none');
        }, 4000);
    }

    initLiff();
</script>
{% endblock %}
