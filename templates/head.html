{% load static %}
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>
        {% block page_title %}
        {% block subtitle %}{% endblock %}
        {% block title %}{% endblock %}・Dot Website
        {% endblock %}
    </title>
    <meta name="description" content="{% block meta_description %}Dot Website 提供海洋驛站、抽獎遊戲、LINE Bot 與多元工具服務。{% endblock %}">
    <meta name="robots" content="index, follow">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Dot Website">
    <meta property="og:title" content="{% block og_title %}Dot Website{% endblock %}">
    <meta property="og:description" content="{% block og_description %}Dot Website 提供海洋驛站、抽獎遊戲、LINE Bot 與多元工具服務。{% endblock %}">
    <meta property="og:image" content="{{ request.scheme }}://{{ request.get_host }}{% static 'pic/index/carousel.jpg' %}">
    <meta property="og:url" content="{{ request.scheme }}://{{ request.get_host }}{{ request.path }}">
    <meta name="google-site-verification" content="yZLVeF9I_z1nJTb6yn9jtNJViqJ0Bb5vYSm0SCvwVhY">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{% block twitter_title %}Dot Website{% endblock %}">
    <meta name="twitter:description" content="{% block twitter_description %}Dot Website 提供海洋驛站、抽獎遊戲、LINE Bot 與多元工具服務。{% endblock %}">
    <meta name="twitter:image" content="{{ request.scheme }}://{{ request.get_host }}{% static 'pic/index/carousel.jpg' %}">
    <link rel="canonical" href="{{ request.scheme }}://{{ request.get_host }}{{ request.path }}">
    <link rel="sitemap" type="application/xml" title="Sitemap" href="{% url 'sitemap' %}">
    {% block extra_meta %}{% endblock %}
    <link rel="icon" href="{% static 'favicon.ico' %}" sizes="any">
    <link rel="apple-touch-icon" href="{% static 'apple-touch-icon.png' %}">
    <link rel="apple-touch-icon-precomposed" href="{% static 'apple-touch-icon-precomposed.png' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
<!--    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js" integrity="sha384-BBtl+eGJRgqQAUMxJ7pMwbEyER4l1g+O15P+16Ep7Q9Q+zqX6gSbd85u4mG4QzX+" crossorigin="anonymous"></script>-->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>
