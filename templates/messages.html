{% if messages %}
<div id="message-container" class="message-toast-container">
    {% for message in messages %}
    <div class="message-toast alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %} shadow" role="alert">
        <div class="d-flex align-items-center">
            <div class="me-3">
                {% if message.tags == 'success' %}
                    <i class="bi bi-check-circle-fill text-success fs-5"></i>
                {% elif message.tags == 'warning' %}
                    <i class="bi bi-exclamation-triangle-fill text-warning fs-5"></i>
                {% elif message.tags == 'error' %}
                    <i class="bi bi-x-circle-fill text-danger fs-5"></i>
                {% endif %}
            </div>
            <div class="flex-grow-1 pe-3 fw-medium">
                {{ message }}
            </div>
            <button type="button" class="btn-close" aria-label="Close" onclick="this.closest('.message-toast').remove()"></button>
        </div>
        <div class="progress-bar-timer"></div>
    </div>
    {% endfor %}
</div>

<style>
    /* 懸浮容器：中間靠上，避開 Header */
    .message-toast-container {
        position: fixed;
        top: 100px; /* 下移避開導覽列 */
        left: 50%;
        transform: translateX(-50%); /* 水平居中核心 */
        z-index: 10000;
        width: 100%;
        max-width: 400px; /* 寬度稍微加寬一點點，比較穩重 */
        padding: 0 20px;
    }

    /* 訊息框主體 */
    .message-toast {
        background: rgba(255, 255, 255, 0.98);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(0, 0, 0, 0.05);
        border-radius: 16px;
        padding: 14px 20px;
        margin-bottom: 15px;
        color: #333;
        position: relative;
        overflow: hidden;
        box-shadow: 0 10px 25px rgba(0,0,0,0.1) !important;
    }

    /* 類型顏色條：改為下方細條，不遮擋玻璃感 */
    .alert-success { border-top: 4px solid #198754; }
    .alert-warning { border-top: 4px solid #ffc107; }
    .alert-danger { border-top: 4px solid #dc3545; }

    .progress-bar-timer {
        position: absolute;
        bottom: 0;
        left: 0;
        height: 3px;
        width: 100%;
        background: rgba(0, 0, 0, 0.03);
    }

    .progress-bar-timer::after {
        content: '';
        display: block;
        height: 100%;
        width: 100%;
        background: currentColor;
        opacity: 0.4;
        animation: timer-shrink 5s linear forwards;
    }

    .alert-success .progress-bar-timer::after { color: #198754; }
    .alert-warning .progress-bar-timer::after { color: #ffc107; }
    .alert-danger .progress-bar-timer::after { color: #dc3545; }

    @keyframes timer-shrink {
        from { width: 100%; }
        to { width: 0%; }
    }
</style>

<script>
    document.querySelectorAll('.message-toast').forEach(function(toast) {
        setTimeout(function() {
            toast.style.opacity = '0';
            toast.style.transform = 'translateY(-10px)'; /* 消失時往上縮一點，視覺更順 */
            toast.style.transition = 'all 0.4s ease';
            setTimeout(function() {
                toast.remove();
            }, 400);
        }, 5000);
    });
</script>
{% endif %}
