{% extends 'base.html' %}
{% load static %}

{% block title %}404{% endblock %}

{% block breadcrumb %}
<li class="breadcrumb-item active" aria-current="page">404</li>
{% endblock %}

{% block body %}
<style>
    /* 延續 login.html 的玻璃容器風格 */
    .confirm-glass-card {
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(15px);
        -webkit-backdrop-filter: blur(15px);
        border: 1px solid rgba(255, 255, 255, 0.5);
        border-radius: 24px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.08);
        padding: 4rem 2rem;
    }

    /* 圖示容器：保持與 login 一致 */
    .icon-box {
        width: 80px;
        height: 80px;
        background: #f8f9fa;
        border-radius: 50%;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 1.5rem;
        box-shadow: inset 0 2px 5px rgba(0,0,0,0.05);
    }

    /* 標題樣式 */
    .confirm-title {
        font-weight: 800;
        color: #2c3e50;
        margin-bottom: 1rem;
    }

    /* 按鈕優化：註冊按鈕採用 LINE 品牌色 */
    .btn-login {
        background: #ffffff;
        color: #111111;
        border-radius: 50px;
        padding: 12px 35px;
        font-weight: 600;
        border: none;
        transition: all 0.3s ease;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        text-decoration: none;
        width: 100%;
        max-width: 300px;
    }

    .btn-login:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.18);
    }

    /* 輔助連結樣式 */
    .auth-link {
        color: #0d6efd;
        font-weight: 600;
        text-decoration: none;
    }

    .auth-link:hover {
        text-decoration: underline;
    }
</style>

<div class="container" style="margin-top: 8vh; margin-bottom: 10vh;">
    <div class="row justify-content-center">
        <div class="col-lg-6 col-md-8 col-sm-11">
            <div class="confirm-glass-card text-center" data-aos="fade-up">
                <h1 class="confirm-title">404</h1>

                <div class="d-flex flex-column align-items-center gap-3">
                    <button type="button" class="btn-login" onclick="history.back()">
                        返回
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
