<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>500</title>
    <style>
        :root {
            --bg: #f6f7fb;
            --ink: #1f2328;
            --accent: #0d6efd;
            --card: #ffffff;
        }
        body {
            margin: 0;
            background: var(--bg);
            color: var(--ink);
            font-family: "Space Grotesk", "Segoe UI", sans-serif;
            min-height: 100vh;
            display: grid;
            place-items: center;
        }
        .card {
            background: var(--card);
            border-radius: 18px;
            padding: 32px 28px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.08);
            text-align: center;
            width: min(420px, 90vw);
        }
        .code {
            font-size: 64px;
            font-weight: 800;
            margin: 12px 0 8px;
        }
        .btn {
            display: inline-block;
            margin-top: 16px;
            padding: 10px 18px;
            background: var(--accent);
            color: #fff;
            text-decoration: none;
            border-radius: 999px;
            font-weight: 600;
        }
        .icon {
            width: 56px;
            height: 56px;
            margin: 0 auto;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="code">500</div>
        <a class="btn" href="{% url 'index' %}">Back to Home</a>
    </div>
</body>
</html>
