<!DOCTYPE html>
<html lang="zh-Hant">
{% load static %}

{% include 'head.html' %}

{% include 'header.html' %}

<style>
    /* 全局背景優化 */
    body {
        /* 使用微細的線性漸層，從頂部淡灰藍過渡到純白 */
        background: linear-gradient(180deg, #F4F7F9 0%, #FFFFFF 100%);
        background-attachment: fixed; /* 讓背景固定，內容滾動時更有質感 */
        min-height: 100vh;
        color: #333;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* 麵包屑導覽優化：讓它更輕盈 */
    .breadcrumb-container {
        padding: 1rem 0;
    }
    .breadcrumb {
        background: transparent;
        padding: 0;
        margin: 0;
        font-size: 0.9rem;
    }
    .breadcrumb-item a {
        color: #6c757d;
        text-decoration: none;
        transition: color 0.2s;
    }
    .breadcrumb-item a:hover {
        color: #000;
    }
    .breadcrumb-item.active {
        color: #adb5bd;
    }

    /* 訊息框容器預留一點間距 */
    .message-wrapper {
        margin-bottom: 1rem;
    }
</style>

<body style="margin: 0;">

<style>
    /* 建立一個固定且不佔空間的背景層 */
    .bg-geometric {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -2;
        background-color: #F8F9FB; /* 基礎底色 */
        /* 使用背景漸層繪製極細線條 */
        background-image:
            linear-gradient(rgba(0,0,0,0.03) 1px, transparent 1px),
            linear-gradient(90deg, rgba(0,0,0,0.03) 1px, transparent 1px);
        background-size: 50px 50px; /* 格線大小 */
    }

    /* 增加一些隨機的幾何裝飾線（非格線） */
    .bg-line-decoration {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -1;
        overflow: hidden;
        pointer-events: none;
    }

    .bg-line-decoration::before {
        content: "";
        position: absolute;
        top: 10%;
        right: -5%;
        width: 40%;
        height: 1px;
        background: linear-gradient(90deg, transparent, rgba(0,0,0,0.05), transparent);
        transform: rotate(-45deg);
    }

    .bg-line-decoration::after {
        content: "";
        position: absolute;
        bottom: 20%;
        left: -10%;
        width: 50%;
        height: 1px;
        background: linear-gradient(90deg, transparent, rgba(0,0,0,0.05), transparent);
        transform: rotate(-45deg);
    }

    /* 內容區塊 */
    .content-wrapper {
        position: relative;
        z-index: 1;
    }
</style>

<div class="bg-geometric"></div>
<div class="bg-line-decoration"></div>

<div class="content-wrapper">
    <div class="container py-3">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb" style="background: transparent;">
                <li class="breadcrumb-item"><a href="{% url 'index' %}" class="text-secondary text-decoration-none">Home</a></li>
                {% block breadcrumb %}{% endblock %}
            </ol>
        </nav>
        {% include 'messages.html' %}
    </div>

    {% block body %}
    {% block sub_body %}{% endblock %}
    {% endblock %}
</div>

{% include 'footer.html' %}

</body>

</html>
